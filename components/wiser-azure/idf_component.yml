version: "0.1.0"
description: "Azure IoT Hub connectivity for ESP-IDF: X.509 DPS provisioning, persistent MQTT session, D2C telemetry, and C2D command handling."
dependencies:
  idf: ">=5.0"
  # NOTE: this component also requires the following to be vendored/available
  # in the consuming project (they are NOT fetched automatically):
  #   - azure-iot-middleware-freertos  (real upstream: https://github.com/Azure/azure-iot-middleware-freertos)
  #   - eb_storage                     (sibling component: NVS-backed config/credential storage)
  #   - eb_network                     (sibling component: WiFi lifecycle management)
  # See README.md "Dependencies" section for how to lay these out as sibling
  # directories via EXTRA_COMPONENT_DIRS.
